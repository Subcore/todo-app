---
# Role: copy the static frontend to the server.
# Source of files: the web/ folder in the project.
# In docker-compose this is a separate nginx container (Dockerfile.web).
# Here we just place the files into a directory; nginx (the next role) serves them.

# 1. Create the site directory.
- name: Create web directory
  file:
    path: "{{ web_dir }}"
    state: directory
    owner: www-data          # standard nginx user on Ubuntu
    group: www-data
    mode: "0755"

# 2. Copy index.html — the application's main page.
- name: Copy index.html
  copy:
    src: ../../../web/index.html
    dest: "{{ web_dir }}/index.html"
    owner: www-data
    group: www-data

# 3. Copy docs.html — the Swagger UI page.
- name: Copy docs.html
  copy:
    src: ../../../web/docs.html
    dest: "{{ web_dir }}/docs.html"
    owner: www-data
    group: www-data

# 4. Copy assets (CSS, JS).
- name: Copy assets
  copy:
    src: ../../../web/assets/
    dest: "{{ web_dir }}/assets/"
    owner: www-data
    group: www-data
