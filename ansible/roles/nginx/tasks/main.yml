---
# Роль: установка и настройка Nginx как reverse proxy + раздача статики
# Источник конфига: web/nginx.conf — адаптирован для работы без Docker

# 1. Установка nginx
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

# 2. Удаляем дефолтный сайт nginx (страница "Welcome to nginx")
- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

# 3. Кладём наш конфиг сайта
# Шаблон todo.conf.j2 основан на web/nginx.conf, но адаптирован:
# - вместо Docker DNS (resolver 127.0.0.11) → прямой proxy_pass на localhost
# - вместо имени контейнера "api" → 127.0.0.1:8080
- name: Deploy site configuration
  template:
    src: todo.conf.j2
    dest: /etc/nginx/sites-available/todo.conf
  notify: reload nginx

# 4. Включаем сайт (симлинк sites-available → sites-enabled)
- name: Enable site
  file:
    src: /etc/nginx/sites-available/todo.conf
    dest: /etc/nginx/sites-enabled/todo.conf
    state: link
  notify: reload nginx

# 5. Запускаем nginx
- name: Ensure nginx is running
  service:
    name: nginx
    state: started
    enabled: yes
