---
# Role: install and configure Nginx as a reverse proxy + static-file server.
# Source of config: web/nginx.conf — adapted for non-Docker use.

# 1. Install nginx.
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

# 2. Remove the default nginx site (the "Welcome to nginx" page).
- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

# 3. Drop in our site config.
# The todo.conf.j2 template is based on web/nginx.conf, adapted:
# - instead of Docker DNS (resolver 127.0.0.11) → direct proxy_pass to localhost
# - instead of the container name "api" → 127.0.0.1:8080
- name: Deploy site configuration
  template:
    src: todo.conf.j2
    dest: /etc/nginx/sites-available/todo.conf
  notify: reload nginx

# 4. Enable the site (symlink sites-available → sites-enabled).
- name: Enable site
  file:
    src: /etc/nginx/sites-available/todo.conf
    dest: /etc/nginx/sites-enabled/todo.conf
    state: link
  notify: reload nginx

# 5. Start nginx.
- name: Ensure nginx is running
  service:
    name: nginx
    state: started
    enabled: yes
