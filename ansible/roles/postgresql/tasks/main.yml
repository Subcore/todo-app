---
# Role: install PostgreSQL and create the DB + user.
# Source of parameters: docker-compose.yaml (db service)
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB

# 1. Install PostgreSQL and the Python adapter (required by the Ansible postgresql_* modules).
- name: Install PostgreSQL and dependencies
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2   # used by Ansible to talk to PostgreSQL
    state: present
    update_cache: yes

# 2. Make sure PostgreSQL is running.
- name: Ensure PostgreSQL is running
  service:
    name: postgresql
    state: started
    enabled: yes

# 3. Create the DB user.
# Counterpart of POSTGRES_USER from docker-compose.yaml.
- name: Create database user
  become_user: postgres
  postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    role_attr_flags: CREATEDB

# 4. Create the database.
# Counterpart of POSTGRES_DB from docker-compose.yaml.
- name: Create database
  become_user: postgres
  postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"

# 5. Allow password authentication for local connections.
# By default PostgreSQL on Ubuntu uses peer authentication,
# but our backend needs to authenticate by password (same as in Docker).
- name: Allow password authentication for local connections
  lineinfile:
    path: /etc/postgresql/16/main/pg_hba.conf
    regexp: '^local\s+all\s+all\s+peer'
    line: 'local   all             all                                     md5'
  notify: restart postgresql

# 6. Grant the todo user all privileges on tables in todo_db.
# Required because migrations run as postgres,
# but the application connects as todo.
- name: Grant all privileges to app user
  become_user: postgres
  postgresql_privs:
    database: "{{ db_name }}"
    privs: ALL
    type: schema
    objs: public
    role: "{{ db_user }}"

- name: Grant all privileges on tables and sequences
  become_user: postgres
  shell: |
    psql -d {{ db_name }} -c "
      GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO {{ db_user }};
      GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO {{ db_user }};
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ db_user }};
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ db_user }};
    "
  changed_when: false
