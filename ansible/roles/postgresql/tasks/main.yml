---
# Роль: установка PostgreSQL и создание БД + пользователя
# Источник параметров: docker-compose.yaml (db сервис)
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB

# 1. Ставим PostgreSQL и Python-адаптер (нужен для Ansible-модуля postgresql_*)
- name: Install PostgreSQL and dependencies
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2   # Ansible использует этот пакет для работы с PostgreSQL
    state: present
    update_cache: yes

# 2. Убеждаемся что PostgreSQL запущен
- name: Ensure PostgreSQL is running
  service:
    name: postgresql
    state: started
    enabled: yes

# 3. Создаём пользователя БД
# Аналог POSTGRES_USER из docker-compose.yaml
- name: Create database user
  become_user: postgres
  postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    role_attr_flags: CREATEDB

# 4. Создаём базу данных
# Аналог POSTGRES_DB из docker-compose.yaml
- name: Create database
  become_user: postgres
  postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"

# 5. Разрешаем подключение по паролю с localhost
# По умолчанию PostgreSQL на Ubuntu использует peer-аутентификацию,
# а нашему backend нужно подключаться по паролю (как в Docker)
- name: Allow password authentication for local connections
  lineinfile:
    path: /etc/postgresql/16/main/pg_hba.conf
    regexp: '^local\s+all\s+all\s+peer'
    line: 'local   all             all                                     md5'
  notify: restart postgresql

# 6. Даём юзеру todo все права на таблицы в БД todo_db
# Нужно потому что миграции запускаются от postgres,
# а приложение подключается как todo
- name: Grant all privileges to app user
  become_user: postgres
  postgresql_privs:
    database: "{{ db_name }}"
    privs: ALL
    type: schema
    objs: public
    role: "{{ db_user }}"

- name: Grant all privileges on tables and sequences
  become_user: postgres
  shell: |
    psql -d {{ db_name }} -c "
      GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO {{ db_user }};
      GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO {{ db_user }};
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ db_user }};
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ db_user }};
    "
  changed_when: false
