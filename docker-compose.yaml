services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-api
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-todo_db}
      - DB_SSLMODE=disable
      - ENABLE_SWAGGER=true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: todo-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend

  migrate:
    image: migrate/migrate
    container_name: todo-migrate
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations/
      - -database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-todo_db}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  seed:
    profiles: [seed]
    image: postgres:16.2-alpine
    container_name: todo-seed
    volumes:
      - ./seeds:/seeds
    entrypoint:
      - sh
      - -c
      - |
        until PGPASSWORD=$$DB_PASSWORD psql -h db -U ${DB_USER:-postgres} -d ${DB_NAME:-todo_db} -c '\q' 2>/dev/null; do
          echo "Waiting for database..."; sleep 1;
        done
        PGPASSWORD=$$DB_PASSWORD psql -h db -U ${DB_USER:-postgres} -d ${DB_NAME:-todo_db} -f /seeds/seed.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    networks:
      - backend

  db:
    image: postgres:16.2-alpine
    container_name: todo-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-todo_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  frontend:
  backend:

volumes:
  postgres_data: