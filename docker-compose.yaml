version: '3.8'

services:
  # Наше Go-приложение
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-api
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Переопределяем переменные из .env.example
      - DB_HOST=db # Указываем имя контейнера БД вместо localhost
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-todo_db}
      - DB_SSLMODE=disable
    depends_on:
      db:
        condition: service_healthy # Ждем, пока БД не ответит на healthcheck

  # Сервис для автоматического наката миграций
  migrate:
    image: migrate/migrate
    container_name: todo-migrate
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations/
      - -database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-todo_db}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy

  # Твоя база данных (оставляем твой изначальный конфиг)
  db:
    image: postgres:16.2-alpine
    container_name: todo-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-todo_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
