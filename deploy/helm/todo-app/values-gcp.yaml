image:
  repository: ghcr.io/subcore/todo-api
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

web:
  image:
    repository: ghcr.io/subcore/todo-web
    tag: "latest"
    pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  # host is set dynamically via Terraform-managed ConfigMap in Flux deployments.
  # For manual helm-deploy-gcp, override with: --set ingress.host=<IP>.nip.io
  host: todo.local

db:
  host: todo-postgresql
  port: "5432"
  name: todo_db
  user: postgres
  # Password supplied via TF_VAR_db_password -> Kubernetes Secret todo-db-credentials.
  # For manual deploys, override with: --set db.password=<password>
  password: postgres
  sslmode: disable
