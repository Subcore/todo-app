image:
  repository: localhost:5000/todo-api
  tag: latest
  pullPolicy: Always

replicaCount: 1

api:
  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

web:
  baseHref: "/web/"
  image:
    repository: localhost:5000/todo-web
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi

enableSwagger: true

ingress:
  enabled: true
  className: nginx
  host: todo.local

# -- Embedded PostgreSQL (Bitnami subchart)
# enabled: true → Helm installs PostgreSQL alongside the app
# enabled: false → set db.host to point at an external database
# NOTE: passwords below are dev-defaults. Override via secret/values-prod.yaml in production.
postgresql:
  enabled: true
  auth:
    username: postgres
    password: postgres
    postgresPassword: postgres
    database: todo_db
  primary:
    persistence:
      enabled: true
      size: 1Gi

db:
  # host is overridden automatically when postgresql.enabled=true
  host: todo-postgresql
  port: "5432"
  name: todo_db
  user: postgres
  # Override via secret in production.
  password: postgres
  sslmode: disable

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
