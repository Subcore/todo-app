<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Todo App — Alpine.js + Tailwind</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#6366f1',
                        'primary-light': '#818cf8',
                        accent: '#f43f5e',
                        success: '#10b981',
                        'card-bg': 'rgba(30, 41, 59, 0.7)',
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        
        .glass-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .todo-item-enter {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .bg-gradient-main {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .gradient-text {
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-gradient-main min-h-screen text-slate-50 flex justify-center p-8 font-sans">
    <div id="app" 
         x-data="{ 
            todos: [], 
            newTodo: '', 
            filter: 'Все',
            async fetchTodos() {
                try {
                    const response = await fetch('/api/v1/todos');
                    if (response.ok) {
                        this.todos = await response.json();
                    }
                } catch (err) {
                    console.error('Ошибка загрузки задач:', err);
                }
            },
            get currentDate() {
                return new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
            },
            get filteredTodos() {
                if (this.filter === 'Активные') return this.todos.filter(t => !t.completed);
                if (this.filter === 'Завершенные') return this.todos.filter(t => t.completed);
                return this.todos;
            },
            get activeCount() {
                return (this.todos || []).filter(t => !t.completed).length;
            },
            get completedCount() {
                return (this.todos || []).filter(t => t.completed).length;
            },
            async addTodo() {
                if (!this.newTodo.trim()) return;
                try {
                    const response = await fetch('/api/v1/todos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: this.newTodo })
                    });
                    if (response.ok) {
                        this.newTodo = '';
                        await this.fetchTodos();
                    }
                } catch (err) {
                    console.error('Ошибка добавления задачи:', err);
                }
            },
            toggleTodo(todo) {
                todo.completed = !todo.completed;
                this.$nextTick(() => lucide.createIcons());
            },
            removeTodo(id) {
                this.todos = this.todos.filter(t => t.id !== id);
            },
            clearCompleted() {
                this.todos = this.todos.filter(t => !t.completed);
            },
            init() {
                this.$watch('todos', () => {
                    this.$nextTick(() => lucide.createIcons());
                });
                lucide.createIcons();
            }
         }" 
         x-init="fetchTodos()"
         x-cloak 
         class="w-full max-w-[480px]">
        <div class="glass-container rounded-[24px] p-10 animate-[fadeIn_0.6s_ease-out]">
            <header class="mb-8 text-center">
                <h1 class="text-[2.2rem] font-bold mb-2 gradient-text">Личные Дела</h1>
                <p class="text-slate-400 text-[0.95rem]" x-text="`${currentDate} — ${todos.length} задач`"></p>
            </header>

            <div class="flex gap-3 mb-8">
                <input 
                    type="text" 
                    x-model="newTodo" 
                    @keyup.enter="addTodo"
                    placeholder="Что нужно сделать?"
                    class="flex-grow bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white text-base transition-all outline-none focus:border-primary focus:bg-white/10 focus:ring-4 focus:ring-primary/15 placeholder-slate-500"
                >
                <button 
                    @click="addTodo"
                    class="bg-primary hover:bg-primary-light active:scale-95 px-6 rounded-2xl text-white font-semibold transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary/20"
                >
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    <span class="hidden sm:inline">Добавить</span>
                </button>
            </div>

            <div class="flex gap-2 mb-6">
                <template x-for="f in ['Все', 'Активные', 'Завершенные']">
                    <button 
                        @click="filter = f"
                        :class="filter === f ? 'bg-white/5 border-primary-light text-white' : 'border-white/10 text-slate-400'"
                        class="px-4 py-2 border rounded-xl text-[0.85rem] cursor-pointer transition-all hover:bg-white/5"
                        x-text="f"
                    ></button>
                </template>
            </div>

            <ul class="flex flex-col gap-3 list-none">
                <template x-for="todo in filteredTodos" :key="todo.id">
                    <li 
                        class="todo-item-enter flex items-center bg-white/5 border border-white/10 p-4 pl-5 rounded-2xl transition-all hover:bg-white/[0.08] hover:scale-[1.01] hover:border-white/20 group"
                        :class="todo.completed && 'opacity-80'"
                    >
                        <div 
                            @click="toggleTodo(todo)"
                            class="w-6 h-6 rounded-lg border-2 border-white/10 mr-4 cursor-pointer flex items-center justify-center transition-all"
                            :class="todo.completed ? 'bg-success border-success' : 'group-hover:border-primary/50'"
                        >
                            <template x-if="todo.completed">
                                <i data-lucide="check" class="w-3.5 h-3.5"></i>
                            </template>
                        </div>
                        
                        <span 
                            class="flex-grow text-base transition-all"
                            :class="todo.completed ? 'text-slate-400 line-through' : 'text-slate-100'"
                            x-text="todo.title"
                        ></span>
                        
                        <button 
                            @click="removeTodo(todo.id)"
                            class="text-slate-400 hover:text-accent hover:bg-accent/10 p-2 rounded-xl transition-all"
                        >
                            <i data-lucide="trash-2" class="w-[18px] h-[18px]"></i>
                        </button>
                    </li>
                </template>
            </ul>

            <div x-show="filteredTodos.length === 0" class="text-center py-12 text-slate-400">
                <i data-lucide="clipboard-list" class="mx-auto mb-4 opacity-50 w-12 h-12"></i>
                <p>Здесь пока пусто...</p>
            </div>

            <div class="mt-8 pt-6 border-t border-white/10 flex justify-between items-center text-slate-400 text-[0.85rem]">
                <span x-text="`${activeCount} активных осталось`" class="font-medium"></span>
                <span 
                    x-show="completedCount > 0"
                    @click="clearCompleted" 
                    class="cursor-pointer hover:text-white transition-colors"
                >Очистить выполненные</span>
            </div>
        </div>
    </div>

    <script>
        // Alpine initialization logic is now directly in x-data
    </script>
</body>
</html>
