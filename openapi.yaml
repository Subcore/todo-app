openapi: 3.0.0
info:
  title: Todo API
  version: 1.0.0
  description: RESTful API for managing todo items with soft delete support
  contact: {}
paths:
  /api/v1/todos:
    get:
      description: Возвращает список всех задач с возможностью фильтрации
      parameters:
        - description: Фильтр по статусу выполнения
          in: query
          name: completed
          schema:
            type: boolean
        - description: Поиск по заголовку (без учёта регистра)
          in: query
          name: search
          schema:
            type: string
        - description: Срок до (RFC3339)
          in: query
          name: due_before
          schema:
            type: string
        - description: Срок после (RFC3339)
          in: query
          name: due_after
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/model.Todo"
                type: array
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: Получить все задачи
      tags:
        - todos
    post:
      description: Создаёт новую задачу с заголовком
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handler.createTodoRequest"
        description: Тело запроса задачи
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.Todo"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: Создать задачу
      tags:
        - todos
  "/api/v1/todos/{id}":
    delete:
      description: Удаляет задачу по ID. Это мягкое удаление (через gorm.DeletedAt).
        Запись остаётся в базе с меткой времени deleted_at.
      parameters:
        - description: ID задачи
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Нет содержимого
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: Удалить задачу (мягкое удаление)
      tags:
        - todos
    get:
      description: Возвращает задачу по её идентификатору
      parameters:
        - description: ID задачи
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.Todo"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: Получить задачу по ID
      tags:
        - todos
    put:
      description: Обновляет заголовок или статус задачи
      parameters:
        - description: ID задачи
          in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handler.updateTodoRequest"
        description: Тело запроса обновления задачи
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.Todo"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: Обновить задачу
      tags:
        - todos
  /api/v1/todos/clear-completed:
    post:
      description: Удаляет все задачи со статусом «выполнено». Это мягкое удаление
        (через gorm.DeletedAt).
      responses:
        "204":
          description: Нет содержимого
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: Удалить все выполненные задачи (мягкое удаление)
      tags:
        - todos
  /api/v1/todos/deleted:
    get:
      description: Возвращает список всех мягко удалённых задач
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/model.Todo"
                type: array
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: Получить все удалённые задачи
      tags:
        - todos
  /healthz:
    get:
      description: Возвращает 200 OK если сервис запущен
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: Проверка жизнеспособности
      tags:
        - health
  /readyz:
    get:
      description: Возвращает 200 OK если сервис готов принимать трафик (соединение с
        БД активно)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: Проверка готовности
      tags:
        - health
components:
  schemas:
    handler.createTodoRequest:
      properties:
        due_date:
          type: string
        tags:
          items:
            type: string
          type: array
        title:
          maxLength: 255
          type: string
      required:
        - title
      type: object
    handler.updateTodoRequest:
      properties:
        completed:
          type: boolean
        due_date:
          type: string
        tags:
          items:
            type: string
          type: array
        title:
          maxLength: 255
          type: string
      required:
        - title
      type: object
    model.Todo:
      properties:
        completed:
          description: Статус выполнения
          type: boolean
        created_at:
          description: Время создания
          format: date-time
          type: string
        deleted_at:
          description: Время мягкого удаления
          format: date-time
          type: string
        due_date:
          description: Срок выполнения
          example: 2023-12-31T23:59:59Z
          format: date-time
          type: string
        id:
          description: Уникальный идентификатор
          type: integer
        tags:
          description: Теги задачи
          items:
            type: string
          type: array
        title:
          description: Заголовок задачи (макс. 255 символов)
          type: string
        updated_at:
          description: Время последнего обновления
          format: date-time
          type: string
      type: object
