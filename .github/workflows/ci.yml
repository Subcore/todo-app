name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "k8s/cluster/todo-app/helmrelease.yaml"
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  openapi:
    name: OpenAPI Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate OpenAPI spec
        run: npx --yes @redocly/cli lint openapi.yaml

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, openapi]

    services:
      postgres:
        image: postgres:16.2-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golang-migrate
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate

      - name: Run migrations
        run: migrate -path migrations -database "postgres://postgres:postgres@localhost:5432/todo_test?sslmode=disable" up

      - name: Test
        env:
          TEST_DB_DSN: host=localhost port=5432 user=postgres password=postgres dbname=todo_test sslmode=disable
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=10
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below minimum threshold ${THRESHOLD}%"
            exit 1
          fi

  build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          SHORT_SHA=${GITHUB_SHA::7}
          TAG="main-${TIMESTAMP}-${SHORT_SHA}"
          OWNER_LC=${OWNER,,}
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/${OWNER_LC}/todo-api:${TAG}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${OWNER_LC}/todo-web:${TAG}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.api }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.web }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    name: Update Image Tags
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update Helm values with new image tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          yq -i '
            (select(.kind == "HelmRelease" and .metadata.name == "todo-app").spec.values.image.tag) = strenv(TAG) |
            (select(.kind == "HelmRelease" and .metadata.name == "todo-app").spec.values.web.image.tag) = strenv(TAG)
          ' k8s/cluster/todo-app/helmrelease.yaml

      - name: Commit and push
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- k8s/cluster/todo-app/helmrelease.yaml; then
            echo "No tag changes to commit"
            exit 0
          fi
          git add k8s/cluster/todo-app/helmrelease.yaml
          git commit -m "chore: update image tags to ${TAG}"
          git push
