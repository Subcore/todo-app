apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: flux-system
spec:
  interval: 1h
  url: oci://registry-1.docker.io/bitnamicharts
  type: oci
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: todo-postgresql
  namespace: todo-app
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 5m
  chart:
    spec:
      chart: postgresql
      version: "18.5.11"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    auth:
      username: postgres
      existingSecret: todo-db-credentials
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
      database: todo_db
    primary:
      persistence:
        enabled: true
        size: 10Gi
      nodeSelector:
        workload: database
      tolerations:
        - key: workload
          operator: Equal
          value: database
          effect: NoSchedule
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: todo-app
  namespace: todo-app
spec:
  interval: 5m
  dependsOn:
    - name: todo-postgresql
  chart:
    spec:
      chart: deploy/helm/todo-app
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    # Image tags managed by Flux image automation (inline for setter markers)
    image:
      tag: "main-20260417T125801-36b1fe8" # {"$imagepolicy": "flux-system:todo-api:tag"}
    web:
      image:
        tag: "main-20260417T121602-e7fcc3c" # {"$imagepolicy": "flux-system:todo-web:tag"}
  valuesFrom:
    - kind: ConfigMap
      name: todo-app-values
      optional: false
    - kind: ConfigMap
      name: todo-app-ingress-values
      optional: false
    - kind: Secret
      name: todo-db-credentials
      valuesKey: password
      targetPath: db.password
      optional: false
