apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-values
  namespace: todo-app
data:
  values.yaml: |
    image:
      repository: ghcr.io/subcore/todo-api
      pullPolicy: IfNotPresent

    imagePullSecrets:
      - name: ghcr-secret

    web:
      image:
        repository: ghcr.io/subcore/todo-web
        pullPolicy: IfNotPresent
      nodeSelector:
        node-pool: app

    postgresql:
      enabled: false

    db:
      host: todo-postgresql
      port: "5432"
      name: todo_db
      user: postgres
      sslmode: disable

    api:
      nodeSelector:
        node-pool: app
